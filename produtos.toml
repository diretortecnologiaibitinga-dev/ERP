# Catálogo de produtos personalizados.
#
# Cada produto descreve a área visível da estampa (largura_cm x altura_cm).
# A peça impressa ganha `margem_cm` de cada lado: é a margem de segurança e
# costura, que fica em branco, com borda preta no limite externo e o código
# do pedido escrito nela. A arte do cliente fica somente dentro da área visível.
#
# Ex.: almofada 45x45 + 1 cm de cada lado = peça de 47x47.

[geral]
dpi = 150                 # resolução mínima desejada para a arte no tamanho final
largura_rolo_cm = 180     # área útil de impressão das impressoras
espaco_entre_pecas_cm = 0.5
comprimento_max_cm = 300  # cada arquivo de lote é dividido nesse comprimento
borda_mm = 1.0            # espessura da borda preta (linha de corte)
enquadrar_rosto = true    # fotomoldura: posiciona a foto pelo rosto (precisa de OpenCV)
pasta_molduras = "molduras"  # PNGs com transparência onde vai a foto; o nome do arquivo é o código

# Equipamentos de transferência (sem emenda de painéis)
prensa_largura_cm = 120
prensa_comprimento_cm = 200
separar_por_transferencia = false  # true = subpastas calandra/ e prensa/ na pasta do RIP

[rip]
# Pastas monitoradas (hot folders) dos Setups do Flexi, por equipamento.
# Cada Setup do Production Manager = impressora + mídia + perfil; ligue o
# encaixe automático nele. Com mais de uma pasta, as peças são divididas
# entre elas (ex.: as duas impressoras). Sem esta seção, use --saida.
# prensa = ['\\PC-RIP\Flexi\Impressora1-Prensa', '\\PC-RIP\Flexi\Impressora2-Prensa']
# calandra = ['\\PC-RIP\Flexi\Impressora1-Rolo']

[uniformes]
# Camisetas de time: moldes importados do PDF do Corel (estampa moldes importar).
pasta_moldes = "moldes"
transferencia = "calandra"    # peças de uniforme vão no rolo
alinhamento = "topo"          # como cada molde se encaixa no quadro de edição: topo | centro
contorno_mm = 0.5             # linha de corte em volta da peça
cor_contorno = "#000000"
fonte = ""                    # arquivo .ttf da fonte dos nomes e números (vazio = padrão)
cor_texto = "#FFFFFF"
cor_contorno_texto = "#000000"
contorno_texto_mm = 1.2
nome_maiusculo = true

# Elementos posicionados: centro = [fração da largura, fração da altura] da peça;
# medidas em cm por grade, para não esticar (o mesmo número em todos os adultos).
[uniformes.elementos.nome]
parte = "costas"
centro = [0.5, 0.20]
altura_cm = { infantil = 3.5, feminino = 4, adulto = 5 }

[uniformes.elementos.numero]
parte = "costas"
centro = [0.5, 0.44]
altura_cm = { infantil = 15, feminino = 18, adulto = 22 }

[uniformes.elementos.numero_frente]   # ligado com --numero-frente
parte = "frente"
centro = [0.5, 0.45]
altura_cm = { infantil = 6, feminino = 7, adulto = 9 }

[uniformes.elementos.patrocinio_costas_topo]
parte = "costas"
centro = [0.5, 0.10]
largura_cm = { infantil = 16, feminino = 20, adulto = 24 }
altura_cm = { infantil = 4, feminino = 5, adulto = 6 }

[uniformes.elementos.patrocinio_costas_base]
parte = "costas"
centro = [0.5, 0.80]
largura_cm = { infantil = 16, feminino = 20, adulto = 26 }
altura_cm = { infantil = 5, feminino = 6, adulto = 7 }

[os]
# Ordens de serviço (clientes que mandam a arte pronta)
pasta = "ordens"          # uma pasta por OS: ficha em PDF, os.json, planilha
prefixo = "OS"

# Avisos de nova OS para a produção. Preencha os canais que quiser usar.
# "env:NOME" lê o valor da variável de ambiente NOME (para não deixar senha aqui).
# A tela da produção é o painel:  estampa painel

[avisos.telegram]
# token = "env:TELEGRAM_TOKEN"   # criado com o @BotFather
# chat_id = "-1001234567890"     # grupo da produção (adicione o robô ao grupo)

[avisos.whatsapp]
# Evolution API (NÃO oficial — use um número só para a produção)
# url = "http://localhost:8080"
# instancia = "producao"
# apikey = "env:EVOLUTION_APIKEY"
# grupo = "120363000000000000@g.us"

[avisos.webhook]
# url = "https://..."             # n8n, Make, ntfy, Discord...

[produtos.almofada-45]
nome = "Almofada 45x45"
transferencia = "auto"   # prensa se couber (1,20 x 2,00 m); "calandra" = rolo a rolo
largura_cm = 45
altura_cm = 45
margem_cm = 1
lados = 2                 # aceita frente e verso
espelhar = false

[produtos.travesseiro-40x70]
nome = "Capa de travesseiro 40x70"
transferencia = "auto"   # prensa se couber (1,20 x 2,00 m); "calandra" = rolo a rolo
largura_cm = 40
altura_cm = 70
margem_cm = 1
lados = 2
espelhar = false

# Produtos sob medida: largura e altura (em cm) vêm de cada pedido.
# Não há emenda de painéis: a peça precisa caber em 1,80 m (largura do rolo e
# da calandra) em pelo menos uma direção.

[produtos.capa-porta]
nome = "Capa de porta"
transferencia = "auto"   # prensa se couber (1,20 x 2,00 m); "calandra" = rolo a rolo
sob_medida = true
margem_cm = 3             # elástico
lados = 1
dpi = 100                 # peças de até 1,50 x 3,00 m
largura_max_cm = 150
altura_max_cm = 300

[produtos.fachada]
nome = "Fachada"
transferencia = "auto"   # prensa se couber (1,20 x 2,00 m); "calandra" = rolo a rolo
sob_medida = true
margem_cm = 1             # a confirmar (bainha/ilhós?)
lados = 1
dpi = 100

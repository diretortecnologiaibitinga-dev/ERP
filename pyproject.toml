[project]
name = "estampa"
version = "0.1.0"
description = "Arquivos de produção (sublimação) e lotes de impressão para produtos personalizados"
requires-python = ">=3.11"
dependencies = ["pillow>=10.1", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
estampa = "estampa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

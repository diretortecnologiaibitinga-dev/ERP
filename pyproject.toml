[project]
name = "estampa"
version = "0.1.0"
description = "Arquivos de produção (sublimação) e lotes de impressão para produtos personalizados"
requires-python = ">=3.11"
dependencies = ["pillow>=10.1", "reportlab>=4.0", "pdfplumber>=0.11", "openpyxl>=3.1"]

[project.optional-dependencies]
rosto = ["opencv-python-headless>=4.8,<5", "numpy"]  # enquadramento da fotomoldura pelo rosto
dev = ["pytest>=8", "opencv-python-headless>=4.8,<5", "numpy"]

[project.scripts]
estampa = "estampa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
estampa = ["demo_dados/*"]
